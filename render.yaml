# Render Blueprint -- https://render.com/docs/blueprint-spec
#
# Platform facts this file and the Dockerfile depend on (checked against
# Render's current docs, not memory):
#   * Render DOES inject $PORT, default 10000. The Dockerfile's shell-form
#     `--port "${PORT:-8000}"` picks that up; the 8000 default is only for
#     local runs. Nothing here should pin PORT.
#   * The app must bind host 0.0.0.0 -- the Dockerfile does.
#   * WebSockets are supported on web services, so /ws/alerts works.
#   * Free plan: 750 instance-hours per workspace per month, spins down after
#     15 minutes without inbound traffic, and takes about a minute to wake.
#     See the keep-alive note in README.md before leaving the pinger on.
services:
  - type: web
    name: weathergpt
    runtime: docker
    plan: free
    # Closest region to the Indian users and judges this is built for.
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .

    # Drives both the post-deploy gate and ongoing health. Render restarts an
    # instance that stops passing this, which is requirement 7's "healthcheck
    # + restart on failure".
    healthCheckPath: /api/health

    autoDeployTrigger: commit

    envVars:
      # Generated by Render and never seen by this repo. The app reads it and
      # injects it into the page at load; nobody has to copy it anywhere.
      - key: DEMO_TOKEN
        generateValue: true

      # Kept true deliberately: /api/alerts/simulate is needed live on stage.
      - key: ENABLE_DEMO_ENDPOINTS
        value: "true"

      - key: RATE_LIMIT_CHAT_PER_MIN
        value: "60"
      - key: RATE_LIMIT_SUBSCRIBE_PER_MIN
        value: "10"

      # CORS_ALLOW_ORIGINS is deliberately NOT set. With it unset the app pins
      # CORS to RENDER_EXTERNAL_URL, which Render injects as this service's own
      # https:// URL -- so there is no chicken-and-egg on the first deploy and
      # no stale origin after a rename. Set it explicitly only to allow an
      # additional origin.
