# Keeps the Render free web service awake.
#
# Render spins a free web service down after 15 minutes without inbound
# traffic and takes about a minute to wake it, which is exactly the cold start
# a judge should never sit through. This pings /api/health every 10 minutes.
#
# ---------------------------------------------------------------------------
# ENABLE THIS ONLY AROUND DEMO DATES.
#
# The free plan grants 750 instance-hours per workspace per calendar month. A
# service kept permanently awake consumes roughly 730 of them -- about 97% of
# the allowance for this one service, leaving nothing for a second and
# suspending the service partway through a month if left on continuously.
#
#   gh workflow enable  keepalive.yml    # day before the demo
#   gh workflow disable keepalive.yml    # immediately after
# ---------------------------------------------------------------------------
#
# SETUP: add repository variable SPACE_URL, e.g.
#   https://weathergpt-pay8.onrender.com
# Settings -> Secrets and variables -> Actions -> Variables -> New variable.
# No token is needed: /api/health is public and ungated.
name: keepalive

on:
  schedule:
    # GitHub cron is UTC and best-effort -- runs can be delayed under load,
    # which is fine for a keep-alive but means this is not a scheduler you
    # should ever hang correctness on.
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: |
          URL="${{ vars.SPACE_URL }}"
          if [ -z "$URL" ]; then
            echo "SPACE_URL repository variable is not set; nothing to ping."
            exit 1
          fi
          code=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 60 "$URL/api/health")
          echo "GET $URL/api/health -> $code"
          cat /tmp/body; echo
          # A spun-down service takes ~1 min to wake, so one retry before we
          # call it a failure.
          if [ "$code" != "200" ]; then
            echo "retrying once after cold start..."
            sleep 30
            code=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 90 "$URL/api/health")
            echo "retry -> $code"; cat /tmp/body; echo
          fi
          [ "$code" = "200" ]
